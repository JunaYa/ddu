packages:
  - apps/*
  - packages/*
  - tools/*
auditConfig:
  ignoreCves: []
allowBuilds:
  esbuild: true
  # fabric's optional Node-side renderer; ddu only runs fabric in the webview.
  canvas: false

catalog:
  "@base-ui/react": "^1.4.0"
  "@hookform/resolvers": "5.2.2"
  "@iconify/react": "^6.0.2"
  "@radix-ui/react-accordion": "^1.2.12"
  "@radix-ui/react-label": "^2.1.8"
  "@radix-ui/react-slot": "^1.2.4"
  "@storybook/react-vite": ^10.6.1
  "@tailwindcss/vite": "^4.3.3"
  "@testing-library/jest-dom": "^6.9.1"
  "@testing-library/react": ^16.3.3
  "@types/node": ^26.6.4
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.2
  "class-variance-authority": "^0.7.1"
  "clsx": "^2.1.1"
  "embla-carousel-react": "^8.6.0"
  "input-otp": "^1.4.2"
  "jsdom": ^30.1.2
  "lucide-react": "^0.563.0"
  "masonic": "^4.1.0"
  "motion": "^12.42.2"
  "photoswipe": "^5.4.4"
  "react": ^19.3.0
  "react-day-picker": "^10.0.1"
  "react-dom": ^19.3.0
  "react-hook-form": "7.72.1"
  "react-resizable-panels": "^4.10.0"
  "recharts": "^3.10.1"
  "storybook": ^10.6.1
  "tailwind-merge": "^3.5.0"
  "tailwindcss": "^4.3.3"
  "tw-animate-css": "^1.4.0"
  "tw-shimmer": "^0.4.11"
  "typescript": ^7.0.2
  "vaul": "^1.1.2"
  "vite": npm:@voidzero-dev/vite-plus-core@1.1.0
  "vite-plus": 1.1.0
  "zod": "^4.3.6"
  "@quantco/pnpm-licenses": ^2.4.2
  "@tanstack/react-query": ^5.104.1
  # Tauri npm packages must match the major.minor of their Rust crates in
  # apps/desktop/src-tauri/Cargo.lock, or `tauri build` refuses to run.
  "@tauri-apps/api": 2.11.0
  "@tauri-apps/cli": 2.11.2
  "@tauri-apps/plugin-autostart": 2.5.1
  "@tauri-apps/plugin-clipboard-manager": 2.3.2
  "@tauri-apps/plugin-dialog": 2.7.1
  "@tauri-apps/plugin-fs": 2.5.1
  "@tauri-apps/plugin-global-shortcut": 2.3.1
  "@tauri-apps/plugin-os": 2.3.2
  "@tauri-apps/plugin-positioner": 2.3.1
  "@tauri-apps/plugin-shell": 2.3.5
  "@tauri-apps/plugin-store": 2.4.3
  "@tauri-apps/plugin-window-state": 2.4.1
  "fabric": 7.4.0

catalogMode: prefer
overrides:
  "@tanstack/react-query": "catalog:"
  react: "catalog:"
  react-dom: "catalog:"
  vite@*: "catalog:"
  vitest@*: 5.0.3
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
